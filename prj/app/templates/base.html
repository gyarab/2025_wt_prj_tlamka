<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I.D.E.A. | Matouš Tlamka</title>
    <style>
        body {
            background-color: #000000;
            color: #ff6600;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            border-bottom: 2px solid #ff6600;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            margin: 0;
            letter-spacing: 5px;
            text-transform: uppercase;
        }
        nav a {
            color: #ff6600;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        footer {
            border-top: 1px solid #ff6600;
            text-align: center;
            padding: 20px;
            font-size: 0.8em;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <header>
        <h1>I. D. E. A.</h1>
        <nav>
            <a href="{% url 'index' %}">Domovská obrazovka</a>
            <a href="/admin" target="_blank">Administrace</a>
        </nav>
    </header>
    
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        &copy; 2026 Matouš Tlamka | Interaktivní Databáze Epistemologie a Axiomů
    </footer>
</body>
</html>
