    <style>
        :root {
            --bg-absolutni: #000000;
            --bg-karta: #0a0a0a;
            --barva-primarni: #ff6600;
            --barva-primarni-zare: rgba(255, 102, 0, 0.15);
            --text-hlavni: #e0e0e0;
            --text-tlumeny: #8a8a8a;
            --border-jemny: #331400;
            --font-nadpis: 'Playfair Display', serif;
            --font-text: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-absolutni);
            color: var(--text-hlavni);
            font-family: var(--font-text);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 {
            font-family: var(--font-nadpis);
            color: var(--barva-primarni);
            font-weight: 600;
            letter-spacing: 2px;
        }

        header {
            background-color: var(--bg-absolutni);
            border-bottom: 1px solid var(--barva-primarni);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px var(--barva-primarni-zare);
        }

        .logo-block { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-image { height: 45px; width: auto; }
        header h1 { font-size: 1.8rem; letter-spacing: 5px; margin: 0; text-transform: uppercase; color: var(--barva-primarni); }

        nav { display: flex; gap: 30px; }
        nav a { color: var(--text-hlavni); text-decoration: none; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; transition: color 0.3s; }
        nav a:hover { color: var(--barva-primarni); }

        main { flex: 1; padding: 60px 50px; max-width: 1400px; margin: 0 auto; width: 100%; }

        /* OPRAVA CENTROVÁNÍ PODNADPISŮ */
        main p {
            font-size: 1.1rem;
            color: var(--text-tlumeny);
            max-width: 800px;
            margin: 0 auto 50px auto; /* Přidáno auto pro strany - tím se text vycentruje */
            text-align: center; /* Zajištění vystředění textu uvnitř bloku */
        }

        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .stat-card { background-color: var(--bg-karta); border: 1px solid var(--border-jemny); padding: 50px 30px; text-align: center; border-radius: 4px; transition: 0.4s; }
        .stat-card:hover { transform: translateY(-5px); border-color: var(--barva-primarni); box-shadow: 0 10px 30px var(--barva-primarni-zare); }
        .stat-number { font-family: var(--font-nadpis); font-size: 5rem; color: var(--barva-primarni); line-height: 1; margin-bottom: 15px; font-weight: 800; }
        .stat-label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-tlumeny); margin-top: 10px; }

        /* PATIČKA S ODKAZEM */
        footer {
            border-top: 1px solid var(--border-jemny);
            text-align: center;
            padding: 30px;
            font-size: 0.8rem;
            color: var(--text-tlumeny);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        footer a {
            color: var(--barva-primarni);
            text-decoration: none;
            transition: opacity 0.3s;
        }
        footer a:hover { opacity: 0.7; }
    </style>
</head>
